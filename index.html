<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
/* Joylashuv: qizil-sariq sarlavhada sana va kunlik jamlar, o'rtada kartalar, pastda menyu */
:root{--bg:#fbf4e6;--card:#fff;--fg:#2e140d;--mut:#80594a;--line:#f0dfbd;--soft:#fdf3da;--ink:#b81d13;--on:#fff;
--grad:linear-gradient(120deg,#b81d13,#cc4a08);--sun:linear-gradient(90deg,#c62015,#f57c00,#ffcc19);--shadow:0 6px 18px rgba(122,52,10,.09);
--f:'Golos Text',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#170b07;--card:#26130c;--fg:#fff1d6;--mut:#d4ad84;--line:#4d2a17;--soft:#33190e;--ink:#ffc933;--on:#2b0d05;--grad:linear-gradient(120deg,#ffcc19,#ff8a3d);--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#170b07;--card:#26130c;--fg:#fff1d6;--mut:#d4ad84;--line:#4d2a17;--soft:#33190e;--ink:#ffc933;--on:#2b0d05;--grad:linear-gradient(120deg,#ffcc19,#ff8a3d);--shadow:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--f);font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding-block:12px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
h1{margin:0;font-size:21px;letter-spacing:-.01em}h2{margin:0 0 10px;font-size:17px;color:var(--ink);display:flex;align-items:center;gap:8px}
h2::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--sun);flex:none}
input,select,button,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;width:100%;min-height:44px}
button{cursor:pointer;width:auto;font-weight:600;transition:transform .1s}button:active{transform:scale(.97)}button:disabled{opacity:.5}
button.main{background:var(--grad);color:var(--on);border-color:transparent}
:focus-visible{outline:3px solid #f59f00;outline-offset:1px}
.hero{background:linear-gradient(135deg,#9f120d 0%,#c22d0a 55%,#c75300 100%);color:#fff;border-radius:22px;padding:14px;display:grid;gap:12px;box-shadow:var(--shadow)}
.bar{display:flex;align-items:center;gap:8px}.bar h1{margin-right:auto}
.hero button,.hero input{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.28);color:#fff;color-scheme:dark}
.bar button{font-size:13px;padding:6px 10px;min-height:38px}
.dates{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px}.dates[hidden]{display:none}.dates button{padding:0;font-size:22px}.dates input{text-align:center;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:#fff6d6;color:#4a1708;border-radius:14px;padding:8px 12px;min-width:0}
.stats div:last-child{grid-column:1/-1;background:#ffcc19;display:flex;justify-content:space-between;align-items:center}
.stats small{display:block;font-size:12px;font-weight:600}.stats b{font-size:19px;overflow-wrap:anywhere}.stats div:last-child b{font-size:23px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border-top:1px solid var(--line);padding:8px max(14px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
nav button{display:grid;justify-items:center;gap:2px;border:0;background:transparent;color:var(--mut);font-size:12px;padding:6px;width:100%;max-width:180px;justify-self:center}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-pressed="true"]{background:var(--grad);color:var(--on)}
#status:empty{display:none}
section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;min-width:0;box-shadow:var(--shadow)}
.item{padding:10px 0;border-bottom:1px solid var(--line)}.item[hidden]{display:none!important}
.top,.nums,.sum,.pay,.exp{display:grid;gap:8px;align-items:center}
.top{grid-template-columns:minmax(0,1fr) auto auto;margin-bottom:6px}
.top input{border:0;padding:2px 0;font-weight:700;background:transparent;min-height:32px;text-overflow:ellipsis}
.nums{grid-template-columns:minmax(0,1fr) auto minmax(0,.9fr)}
.val{text-align:right;color:var(--ink);font-weight:600;font-size:14px}
.x{border:0;background:transparent;color:var(--mut);padding:4px 10px;min-height:36px;font-weight:400}
.sum{grid-template-columns:1fr auto;margin-top:12px;font-weight:700;font-size:17px;background:var(--soft);border-radius:12px;padding:10px 12px}
.pay{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}.pay:not(:has([data-f="rate"])) [data-f="amount"]{grid-column:1/-1}.pay .val{grid-column:1;text-align:left}.pay .del{grid-column:2;justify-self:end;font-size:13px}
.exp{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
.add{margin-top:10px}
button[data-open-pick]{width:100%;min-height:48px}
button[data-add]:not(.main){background:transparent;border-style:dashed;border-color:var(--ink);color:var(--ink)}
.mut{color:var(--mut);font-size:13px}
.kg{display:flex;gap:6px;min-width:0}.kg input{font-weight:700}.kg button{padding:0 14px;font-size:20px;color:var(--ink)}
.picker{position:fixed;inset:auto 0 0;z-index:20;max-width:560px;margin:0 auto;height:82%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;grid-template-columns:minmax(0,1fr);gap:10px;background:var(--card);border-radius:22px 22px 0 0;border-top:5px solid #f57c00;box-shadow:0 0 0 100vmax rgba(20,5,0,.55);padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
.picker strong{font-size:17px}
.choices{overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:14px}
.choices button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px;min-height:50px;font-weight:400}
.choices i{flex:none;width:22px;height:22px;border:2px solid var(--mut);border-radius:6px;display:grid;place-items:center;font-style:normal;font-size:15px}
.choices button span:first-of-type{margin-right:auto}.choices button[aria-pressed="true"]{background:var(--soft);font-weight:700}
.choices button[aria-pressed="true"] i{background:var(--grad);border-color:transparent;color:var(--on)}.choices button[aria-pressed="true"] i::after,.choices button:disabled i::after{content:"✓"}
.choices button span:last-child{white-space:nowrap;color:var(--ink);font-weight:700}.choices #nofound{padding:14px}
.compact .item.p:not(.m){display:grid;grid-template-columns:minmax(0,1fr) 148px;gap:0 8px;align-items:center;padding:6px 0}
.compact .item.p:not(.m) .top{grid-template-columns:minmax(0,1fr) auto;gap:0;margin:0}.compact .item.p:not(.m) .top input{grid-column:1;font-size:14px}.compact .item.p:not(.m) .x{grid-column:2;grid-row:1}
.compact .item.p:not(.m) .nums{display:block}.compact .item.p:not(.m) .x1,.compact .item.p:not(.m) [data-f="price"]{display:none}
.compact .item.p:not(.m) .val{grid-column:1/-1;grid-row:2;text-align:left;font-size:12px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.55 var(--f);margin:0 0 10px;user-select:all;background:var(--soft);border:1px dashed var(--line);border-radius:12px;padding:12px;max-height:280px;overflow-y:auto}
#png{width:100%;min-height:52px;font-size:17px}
.ready{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}.ready h2{margin:0}.ready #img{width:100%;border:1px solid var(--line)}.ready pre{margin:0}#imgmsg:empty{display:none}.row{display:flex;gap:8px;flex-wrap:wrap}.row>button{flex:1}
#img{border-radius:12px}#plrows{font-size:17px}
table{width:100%;border-collapse:collapse}td{padding:8px 0;border-bottom:1px solid var(--line)}td+td{text-align:right;padding-left:8px;white-space:nowrap;font-weight:700}td button{min-height:38px;padding:6px 12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700&display=swap">
<main>
<header class="hero">
<div class="bar"><h1>Yuk hisoboti</h1><button id="compact"></button><button id="theme"></button></div>
<div class="dates" id="dates"><button id="prev" aria-label="Oldingi kun">‹</button><input type="date" id="date" aria-label="Sana"><button id="next" aria-label="Keyingi kun">›</button></div>
<div class="stats" id="stats"><div><small>Nurli Quyosh</small><b data-s="nq">0</b></div><div><small>Uch Tepa</small><b data-s="ut">0</b></div><div><small>Jami pul</small><b data-s="got">0</b></div></div>
</header>
<nav aria-label="Bo'limlar"><button data-v="day"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h3"/></svg>Kunlik</button><button data-v="month"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Oylik</button><button data-v="price"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V3h9l9 9-9 9zM7.5 7.5h.01"/></svg>Narxlar</button></nav>
<div class="mut" id="status" role="status"></div>
<div id="view" style="display:grid;gap:12px;grid-template-columns:minmax(0,1fr)"></div>
</main>
<script>
const WH={nq:"Nurli Quyosh",ut:"Uch Tepa"};
const LIST=[["SIYOB2",33900],["SIYOB3",33500],["Siyob4",33500],["Siyob5",33500],["Siyob6",30900],["ArbaT Tabaka (05-08)",30400],["Arba1 (08-09)",30400],["Arba2 (09-1.05)",28900],["Arba3 (1,05-1,15)",28900],["Arba4 (1.15-1.25)",28900],["Arba5 (1.25-1.4)",28900],["Arba6 (1.4-1.5)",28900],["KATTA ARBA 1.5-1,8",25900],["Asfa 12-13",27900],["YIRIK",24500],["Qopli 10-11",28500],["Qopli 1,1-1,3",27900],["Qopli 1,3-1,4",29500],["ARBA (okoroc)",27900],["Favorit ok.",16900],["Yangi okorocka (св.)",25900],["Turk golen",30900],["Golen YANGI",26900],["Qopcha golen (karobka)",30900],["ARBA golen (paket)",35900],["Qanot YANGI sv.",36900],["Qanot karobka (qop)",38500],["ARBA qanot (paket)",42500],["Yelkacha-B (Polsha)",29500],["Rus. Yelkacha",33500],["UKR. Yelkacha (A-klas)",36500],["File sv.",34500],["file (muzlagan)",35900],["Mayda file",22500],["ARBA file (+paket)",39900],["Yangi bedro (sv.)",31400],["Bedro ARBA paket",35900],["Bedro (siyob)",35400],["Bedro (marinovka)",35400],["Teri",11000],["Karkas",6000],["Oshqozon.",6900],["Jigar.",5500],["Pangasius (rasepnoy)",49500],["Pangasius (butun baliq)",49500],["BUTUN O'rdak",31300],["O‘rdak file",31500],["Terisiz O‘RDAK file",33500],["oyoqcha o'rdak",27900],["Sosiska (Canada🇨🇦)",26900],["Sosiska (Rossiya🇷🇺)",13500],["86- TIL",49900],["152-kalla go'sht",71900],["64-Sarpanja",93500]];
const DEF={ver:2,pct:0.2,nq:LIST,ut:LIST};
const $=s=>document.querySelector(s);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dec=s=>parseFloat(String(s??"").replace(/\s/g,"").replace(",","."))||0;
const kgv=s=>Math.round(String(s??"").split("+").reduce((a,p)=>a+dec(p),0)*1000)/1000;
// pul: "100 000+800'000" kabi yozuvni qo'shib beradi
const money=s=>String(s??"").split("+").reduce((a,p)=>a+(parseInt(p.replace(/\D/g,""),10)||0),0);
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ");
const r1000=n=>Math.round(n/1000)*1000;
const kgf=n=>String(Math.round(n*100)/100).replace(".",",");
const whRaw=(d,k)=>d[k].reduce((a,r)=>a+kgv(r.kg)*money(r.price),0);
const payVal=(d,p)=>p.type==="Valyuta"?dec(p.amount)*money(p.rate):p.type==="Plastik"?money(p.amount)*(1-d.pct/100):money(p.amount);
const TYPES=["Naqd","Click","Plastik","Valyuta"];
function totals(d){const t={nq:r1000(whRaw(d,"nq")),ut:r1000(whRaw(d,"ut")),by:{},usd:0};
 TYPES.forEach(k=>t.by[k]=0);
 d.pays.forEach(p=>{t.by[p.type]+=payVal(d,p);if(p.type==="Valyuta")t.usd+=dec(p.amount)});
 t.by.Plastik=Math.round(t.by.Plastik);
 t.plRaw=d.pays.reduce((a,p)=>a+(p.type==="Plastik"?money(p.amount):0),0);t.plCut=t.plRaw-t.by.Plastik;
 t.load=t.nq+t.ut;t.got=TYPES.reduce((a,k)=>a+t.by[k],0);t.exp=d.exps.reduce((a,e)=>a+money(e.amount),0);t.cash=t.by.Naqd-t.exp;return t}
const plLine=(d,t)=>`${fmt(t.plRaw)} - ${kgf(d.pct)}% = ${fmt(t.by.Plastik)}`;
const signed=n=>(n<0?"-":"")+fmt(Math.abs(n));
function report(date,d){const t=totals(d),o=["📅 "+date.split("-").reverse().join(".")];
 for(const k in WH){const rows=sorted(d[k]);if(!rows.length)continue;
  o.push("",WH[k]);rows.forEach(r=>o.push(`${r.name}: ${kgf(kgv(r.kg))} kg × ${fmt(money(r.price))}`));o.push("Jami: "+fmt(t[k]))}
 o.push("","TOP PUL");
 TYPES.forEach(k=>{const l=d.pays.filter(p=>p.type===k&&payVal(d,p));if(!l.length)return;
  o.push(k==="Click"?"Click:":`${k}: ${k==="Plastik"?plLine(d,t):fmt(t.by[k])}`);
  if(k==="Click"){o.push("  "+clickParts(l).join(" + "));return}
  l.forEach(p=>{if(k==="Valyuta")o.push(`  ${p.who||"-"}: ${kgf(dec(p.amount))}$ × ${fmt(money(p.rate))}`);
   else if(p.who||l.length>1||String(p.amount).includes("+"))o.push(`  ${p.who?p.who+": ":""}${String(p.amount).split("+").map(x=>fmt(money(x))).join(" + ")}`)})});
 o.push("Jami pul: "+fmt(t.got));
 const ex=d.exps.filter(e=>money(e.amount));
 if(ex.length){o.push("","Rasxod: "+fmt(t.exp));ex.forEach(e=>o.push(`  ${e.name||"-"}: ${fmt(money(e.amount))}`))}
 return o.join("\n")}

// hisobotni daftar ko'rinishida rasmga chizadi
function band(g,W,H){const x=g.createLinearGradient(0,0,W,0);x.addColorStop(0,"#b81d13");x.addColorStop(.5,"#f57c00");x.addColorStop(1,"#ffcc19");g.fillStyle=x;g.fillRect(0,0,W,16);g.fillRect(0,H-16,W,16)}
const ORDER=["SIYOB2","SIYOB3","Siyob4","Siyob5","Siyob6","Bedro ARBA paket","Bedro (siyob)","ARBA (okoroc)","Favorit ok.","Yangi okorocka (св.)","Qopli 10-11","Qopli 1,1-1,3","Qopli 1,3-1,4","Qanot YANGI sv.","Qanot karobka (qop)","ARBA qanot (paket)","File sv.","file (muzlagan)","Mayda file","ARBA file (+paket)","Turk golen","Golen YANGI","Qopcha golen (karobka)","ARBA golen (paket)","Yelkacha-B (Polsha)","Rus. Yelkacha","UKR. Yelkacha (A-klas)","Yangi bedro (sv.)","Bedro (marinovka)","ArbaT Tabaka (05-08)","Arba1 (08-09)","Arba2 (09-1.05)","Arba3 (1,05-1,15)","Arba4 (1.15-1.25)","Arba5 (1.25-1.4)","Arba6 (1.4-1.5)","KATTA ARBA 1.5-1,8","YIRIK","Teri","Karkas","Oshqozon.","Jigar.","Pangasius (rasepnoy)","Pangasius (butun baliq)","BUTUN O'rdak","O‘rdak file","Terisiz O‘RDAK file","oyoqcha o'rdak","Sosiska (Canada🇨🇦)","Sosiska (Rossiya🇷🇺)","Asfa 12-13","86- TIL","152-kalla go'sht","64-Sarpanja"];
// tayyor hisobotdagi tartib; ro'yxatda yo'q nomlar oxirida, qo'shilgan tartibida
const rank=n=>{const i=ORDER.findIndex(x=>norm(x)===norm(n));return i<0?ORDER.length:i};
const sorted=rows=>rows.filter(r=>kgv(r.kg)).sort((a,b)=>rank(a.name)-rank(b.name));
// har bir Click summasi, ism bo'lsa birinchi summasi oldida
const clickParts=l=>l.flatMap(p=>String(p.amount).split("+").filter(a=>money(a)).map((a,i)=>(i===0&&p.who?p.who+": ":"")+fmt(money(a))));
function picture(date,d){const t=totals(d),W=1080,P=48,IN=W-2*P,c=document.createElement("canvas"),g=c.getContext("2d"),ops=[];
 const RED="#b81d13",INK="#2e140d",MUT="#80594a",LINE="#f0dfbd";
 const text=(s,x,y,{s:size=30,b=0,a="left",c:col=INK,w=IN}={})=>ops.push(()=>{g.font=`${b?700:400} ${size}px 'Golos Text',system-ui,sans-serif`;g.textAlign=a;g.fillStyle=col;g.fillText(s,x,y,w)});
 const box=(x,y,w,h,col,r=22)=>ops.push(()=>{g.fillStyle=col;g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.fill()});
 const rule=(x,y,w)=>ops.push(()=>{g.fillStyle=LINE;g.fillRect(x,y,w,2)});
 // sarlavha
 ops.push(()=>{const x=g.createLinearGradient(0,0,W,0);x.addColorStop(0,"#a8150f");x.addColorStop(.6,"#c93a0a");x.addColorStop(1,"#f59f00");g.fillStyle=x;g.fillRect(0,0,W,150)});
 text(date.split("-").reverse().join("."),W/2,103,{s:76,b:1,c:"#fff",a:"center"});
 let y=180;
 // omborlar: ikkalasida ham yuk bo'lsa yonma-yon, bittasida bo'lsa to'liq kenglikda
 const used=Object.keys(WH).filter(k=>d[k].some(r=>kgv(r.kg)));
 if(used.length){const gap=24,cw=used.length===2?(IN-gap)/2:IN,rows=k=>sorted(d[k]);
  const h=84+Math.max(...used.map(k=>rows(k).length))*90+92;
  used.forEach((k,n)=>{const x=P+n*(cw+gap),L=x+22,R=x+cw-22;box(x,y,cw,h,LINE);box(x+2,y+2,cw-4,h-4,"#fff",20);
   text(WH[k],x+cw/2,y+54,{s:36,b:1,a:"center",c:RED,w:cw-30});
   rows(k).forEach((r,i)=>{const yy=y+84+i*90;rule(L,yy,cw-44);text(r.name,L,yy+36,{s:28,b:1,w:cw-44});text(`${kgf(kgv(r.kg))} kg × ${fmt(money(r.price))}`,L,yy+72,{s:27,c:MUT,w:cw-44})});
   box(x+12,y+h-82,cw-24,70,"#ffe27a",14);text("Jami",L+4,y+h-35,{s:30,b:1,w:100});text(fmt(t[k]),R-4,y+h-35,{s:36,b:1,a:"right",w:cw-160})});
  y+=h+30}
 const row=(a,b,o={})=>{text(a,P+8,y+34,{w:620,...o});text(b,W-P-8,y+34,{a:"right",w:360,...o});y+=52};
 const bar=(a,b,bg,col)=>{box(P,y+4,IN,76,bg,16);text(a,P+22,y+54,{s:34,b:1,c:col,w:520});text(b,W-P-22,y+55,{s:40,b:1,c:col,a:"right",w:420});y+=104};
 if(t.got){text("Top pul",P+8,y+38,{s:36,b:1,c:RED});y+=60;
  TYPES.forEach(k=>{const l=d.pays.filter(p=>p.type===k&&payVal(d,p));if(!l.length)return;rule(P,y,IN);if(k==="Plastik"){text(k,P+8,y+34,{s:31,b:1,w:200});text(plLine(d,t),W-P-8,y+34,{s:31,b:1,a:"right",w:IN-230});y+=52}else row(k,k==="Click"?"":fmt(t.by[k]),{s:31,b:1});
   if(k==="Click"){const parts=clickParts(l);{
     g.font="700 32px 'Golos Text',system-ui,sans-serif";let cur="";const lines=[];

 else if(k[0]==="c"){store.cat[k.slice(1)][i][f]=+f?money(v):v;save("prices");draft=null}
 else{cur()[k][i][f]=v;save(date);if(f==="type")render();else calc();$("#demo")?.remove()}});
$("#view").addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.openPick){chosen.clear();picker=b.dataset.openPick;query="";render()}
 else if(b.dataset.close){picker=null;render()}
 else if(b.dataset.choose){const i=+b.dataset.choose;chosen.has(i)?chosen.delete(i):chosen.add(i);b.setAttribute("aria-pressed",chosen.has(i));
  $("#addsel").textContent=addLabel();$("#addsel").disabled=!chosen.size}
 else if(b.id==="addsel"){const k=picker,rows=cur()[k],first=rows.length;
  for(const i of chosen){const [name,price]=store.cat[k][i];if(!rows.some(r=>r.name===name))rows.push({name,price,kg:""})}
  chosen.clear();picker=null;save(date);render();$("#"+k+"k"+first)?.focus()}
 else if(b.dataset.custom){const k=b.dataset.custom,i=cur()[k].push({name:"",price:"",kg:"",custom:true})-1;save(date);picker=null;render();$("#"+k+"n"+i).focus()}
 else if(b.dataset.plus){const f=document.getElementById(b.dataset.plus);if(f.value&&!f.value.endsWith("+")){f.value+="+";f.dispatchEvent(new Event("input",{bubbles:true}))}f.focus();f.setSelectionRange(f.value.length,f.value.length)}
 else if(b.dataset.add==="click"){const l=cur().pays,at=l.map(p=>p.type).lastIndexOf("Click"),i=at<0?l.length:at+1;
  l.splice(i,0,{type:"Click",who:"",amount:"",rate:""});save(date);render();$("#paysamount"+i).focus()}
 else if(b.dataset.add){const k=b.dataset.add;
  if(k[0]==="c"){store.cat[k.slice(1)].push(["",0]);draft=null;save("prices")}
  else{cur()[k].push(k==="pays"?{type:"Naqd",who:"",amount:"",rate:""}:k==="exps"?{name:"",amount:""}:{name:"",price:"",kg:""});save(date)}render()}
 else if(b.dataset.del){const[k,i]=b.dataset.del.split("-");
  if(!b.dataset.sure){b.dataset.sure=1;b.textContent="O'chirilsinmi?";return}
  if(k[0]==="c"){store.cat[k.slice(1)].splice(i,1);draft=null;save("prices")}else{cur()[k].splice(i,1);save(date)}render()}
 else if(b.dataset.open){date=b.dataset.open;view="day";render()}
 else if(b.id==="png")saveImage(b);
 else if(b.id==="backup")backup();
 else if(b.id==="check"){impText=$("#paste").value;startImport(impText);render()}
 else if(b.id==="cancel"){imp=null;impMsg="";render()}
 else if(b.id==="apply"){applyImport();render()}
 else if(b.dataset.new){const key=$("#newitem").value,k=b.dataset.new;if(!key)return;const name=imp.items.find(x=>x.key===key).name;
  if(!imp.add.some(a=>a.k===k&&a.key===key)&&!store.cat[k].some((r,i)=>r[0]===name||imp.pick[k+i]===key))imp.add.push({k,key});
  else impMsg="Bu mahsulot shu omborda bor.";render()}
 else if(b.id==="copy"){try{await navigator.clipboard.writeText($("#out").textContent);b.textContent="Nusxa olindi"}catch(x){$("#out").hidden=false;getSelection().selectAllChildren($("#out"));b.textContent="Matn belgilandi, nusxalang"}}
});
$("#date").addEventListener("change",e=>{if(e.target.value){picker=null;date=e.target.value;render()}});
$("#view").addEventListener("change",e=>{if(e.target.id==="restore"&&e.target.files[0])restore(e.target.files[0])});
$("#view").addEventListener("change",e=>{if(!imp)return;
 if(e.target.dataset.pick){imp.pick[e.target.dataset.pick]=e.target.value;render()}else if(e.target.id==="useday")imp.useDay=e.target.checked});
$("#view").addEventListener("input",e=>{if(e.target.id==="q"){query=e.target.value;filter()}});
function step(n){const [y,m,d]=date.split("-").map(Number),x=view==="month"?new Date(y,m-1+n,1):new Date(y,m-1,d+n);
 date=`${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`;picker=null;render()}
$("#prev").addEventListener("click",()=>step(-1));$("#next").addEventListener("click",()=>step(1));
$("#view").addEventListener("keydown",e=>{if(e.key!=="Enter"||e.target.dataset.f!=="kg")return;e.preventDefault();
 const all=[...document.querySelectorAll('[data-f="kg"]')],next=all[all.indexOf(e.target)+1];next?next.focus():e.target.blur()});
$("#compact").addEventListener("click",()=>setUi("compact",!ui.compact));
$("#theme").addEventListener("click",()=>setUi("theme",isDark()?"light":"dark"));
applyUi();
const todayStr=()=>{const n=new Date();return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`};
let lastToday=todayStr();
function newDay(){const t=todayStr();if(t===lastToday)return;if(date===lastToday){date=t;picker=null;render()}lastToday=t}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)newDay()});setInterval(newDay,60000);
document.querySelector("nav").addEventListener("click",e=>{const t=e.target.closest("[data-v]");if(t){view=t.dataset.v;picker=null;render();scrollTo(0,0)}});
render();
(async()=>{try{const db=await window.claude?.use("db"),user=await window.claude?.use("user"),id=await user?.id();
 if(!db||!id){$("#status").textContent="Ma'lumot faqat shu telefonda saqlanadi.";return}
 const c=db.collection("data/users/"+id),snap=await c.get();
 snap.docs.forEach(s=>{const v=clone(s.data());
  if(s.id==="prices"){if(v.at>store.catAt){store.cat=v.cat;store.catAt=v.at;draft=null}}
  else if(s.id.startsWith("day-")){const k=s.id.slice(4);if(!store.days[k]||v.at>store.days[k].at)store.days[k]=v}});
 tidy();col=c;keep();if(!document.activeElement?.matches("input,select"))render();else calc();flush()}
 catch(e){$("#status").textContent="Serverga ulanib bo'lmadi. Ma'lumot shu telefonda saqlanadi."}})();
</script>
